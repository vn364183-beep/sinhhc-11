<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Sinh Học 11 - Đề Thi Chính Thức Bình Chánh</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .section-title {
            background: var(--primary);
            color: white;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e1e8ed;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .options label {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dcdde1;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .options label:hover {
            background: #f1f2f6;
        }
        .options input {
            margin-right: 10px;
        }
        .sub-question {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #dcdde1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .sub-text {
            flex: 1;
            min-width: 300px;
            font-size: 14px;
        }
        .sub-options {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .feedback {
            font-size: 13px;
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 4px;
            display: none;
        }
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .top-control {
            background: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #score-display {
            font-size: 16px;
            font-weight: bold;
            color: #f1c40f;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .btn-submit { background-color: var(--success); }
        .btn-reset { background-color: #3498db; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-control">
        <div id="score-display">Điểm: Chưa nộp bài</div>
        <div>

            <button class="btn btn-reset" onclick="loadExam()">🔄 LÀM LẠI</button>
        </div>
    </div>

    <h1>TRƯỜNG THCS VÀ THPT BÌNH CHÁNH</h1>
    <div class="subtitle">BÀI KIỂM TRA SINH HỌC 11 (ĐỀ THI CHÍNH THỨC)</div>

    <div id="exam-form">
        <!-- Phần I -->
        <div class="section-title">PHẦN I: Trắc nghiệm 4 lựa chọn (7.0 điểm)</div>
        <div id="part1-container"></div>

        <!-- Phần II -->
        <div class="section-title">PHẦN II: Trắc nghiệm Đúng / Sai (3.0 điểm)</div>
        <div id="part2-container"></div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-submit" style="padding: 12px 30px; font-size: 16px;" onclick="gradeExam()">NỘP BÀI & XEM ĐIỂM</button>
        </div>
    </div>
</div>

<script>
    // Kho dữ liệu chuẩn 108 câu trắc nghiệm Phần I
    const POOL_PART1 = [
        { text: "Câu 1. Sinh vật thu nhận các chất từ môi trường và vận chuyển các chất thông qua quá trình nào?", options: ["A. Hấp thụ và vận chuyển các chất.", "B. Biến đổi các chất.", "C. Bài tiết và đào thải.", "D. Đồng hóa và dị hóa."], correct: 0, explain: "Sinh vật thu nhận các chất từ môi trường và vận chuyển các chất thông qua quá trình hấp thụ và vận chuyển các chất." },
        { text: "Câu 2. Nước và các chất dinh dưỡng được vận chuyển trong cây nhờ các dòng vận chuyển nào?", options: ["A. Dòng mạch gỗ và dòng mạch rây.", "B. Dòng mạch gỗ và dòng tế bào.", "C. Dòng mạch rây và dòng gian bào.", "D. Dòng mạch rây và dòng khí khổng."], correct: 0, explain: "Nước và các chất dinh dưỡng được vận chuyển trong cây nhờ dòng mạch gỗ và dòng mạch rây[cite: 1]." },
        { text: "Câu 3. Cơ chế hấp thụ nước từ đất vào tế bào lông hút của rễ là:", options: ["A. Cơ chế thẩm thấu.", "B. Cơ chế vận chuyển chủ động.", "C. Cơ chế nhập bào.", "D. Cơ chế xuất bào."], correct: 0, explain: "Nước được hấp thụ từ đất vào tế bào lông hút của rễ theo cơ chế thẩm thấu[cite: 2]." },
        { text: "Câu 4. Ion khoáng từ đất vào tế bào lông hút theo những cơ chế nào?", options: ["A. Chủ động và thụ động.", "B. Thẩm thấu và thẩm tách.", "C. Nhập bào và xuất bào.", "D. Khuếch tán và thẩm thấu."], correct: 0, explain: "Ion khoáng từ đất vào tế bào lông hút theo cơ chế chủ động và thụ động[cite: 3]." },
        { text: "Câu 5. Động lực chính đẩy dòng mạch gỗ di chuyển từ rễ lên lá là gì?", options: ["A. Lực hút do thoát hơi nước ở lá.", "B. Lực đẩy của áp suất rễ.", "C. Lực liên kết giữa các phân tử nước.", "D. Lực bám giữa các phân tử nước với thành mạch gỗ."], correct: 0, explain: "Động lực chính đẩy dòng mạch gỗ là lực hút do thoát hơi nước ở lá[cite: 4]." },
        { text: "Câu 6. Sự vận chuyển các chất hữu cơ tổng hợp ở lá đến các cơ quan khác chủ yếu nhờ dòng nào?", options: ["A. Dòng mạch rây.", "B. Dòng mạch gỗ.", "C. Dòng gian bào.", "D. Dòng tế bào chất."], correct: 0, explain: "Chất hữu cơ tổng hợp ở lá được vận chuyển chủ yếu nhờ dòng mạch rây[cite: 5]." },
        { text: "Câu 7. Thoát hơi nước ở thực vật diễn ra chủ yếu qua cơ quan nào?", options: ["A. Lá.", "B. Thân.", "C. Rễ.", "D. Hoa."], correct: 0, explain: "Thoát hơi nước ở thực vật diễn ra chủ yếu ở lá[cite: 6]." },
        { text: "Câu 8. Thoát hơi nước ở lá cây diễn ra theo những con đường nào?", options: ["A. Qua khí khổng và qua lớp cutin.", "B. Qua khí khổng và qua mô giậu.", "C. Qua lớp cutin và qua mạch gỗ.", "D. Qua lớp cutin và qua màng tế bào."], correct: 0, explain: "Thoát hơi nước ở lá cây diễn ra qua con đường khí khổng và qua lớp cutin[cite: 7]." },
        { text: "Câu 9. Tác nhân chính điều tiết độ mở của khí khổng là gì?", options: ["A. Hàm lượng nước trong tế bào khí khổng.", "B. Nồng độ CO2 trong khí quyển.", "C. Nhiệt độ môi trường.", "D. Cường độ ánh sáng chiếu vào lá."], correct: 0, explain: "Tác nhân chính điều tiết độ mở của khí khổng là hàm lượng nước trong tế bào khí khổng[cite: 8]." },
        { text: "Câu 10. Vai trò nào sau đây KHÔNG phải là vai trò của quá trình thoát hơi nước?",
        options: ["A. Cung cấp năng lượng ATP cho các hoạt động sống.", "B. Là động lực đầu trên kéo dòng mạch gỗ.", "C. Giúp hạ nhiệt độ của lá cây vào những ngày nắng nóng.", "D. Tạo điều kiện cho CO2 khuếch tán vào lá cung cấp cho quang hợp."],
        correct: 0, explain: "Thoát hơi nước không cung cấp năng lượng ATP cho các hoạt động sống." },
        { text: "Câu 11. Nguyên tố dinh dưỡng khoáng thiết yếu là nguyên tố:", options: ["A. Mà thiếu nó cây không hoàn thành được chu kì sống.", "B. Có hàm lượng chiếm hơn 0,01% khối lượng chất khô.", "C. Trực tiếp tham gia vào quá trình phân giải chất hữu cơ.", "D. Có thể thay thế được bởi các nguyên tố khác có tính chất tương tự."], correct: 0, explain: "Nguyên tố thiết yếu là nguyên tố mà thiếu nó cây không hoàn thành chu kì sống." },
        { text: "Câu 12. Dựa vào hàm lượng trong cơ thể thực vật, các nguyên tố khoáng được chia thành:", options: ["A. Nguyên tố đa lượng và nguyên tố vi lượng.", "B. Nguyên tố thiết yếu và nguyên tố không thiết yếu.", "C. Nguyên tố dễ di chuyển và nguyên tố khó di chuyển.", "D. Nguyên tố kim loại và nguyên tố phi kim."], correct: 0, explain: "Các nguyên tố khoáng được chia thành nguyên tố đa lượng và vi lượng." },
        { text: "Câu 13. Nhóm các nguyên tố nào sau đây thuộc nhóm nguyên tố đa lượng?", options: ["A. C, H, O, N, P, K, S, Ca, Mg.", "B. Fe, Mn, B, Zn, Cu, Mo, Cl.", "C. C, H, O, Fe, Mn, B, Zn.", "D. N, P, K, Cu, Zn, Mo, Cl."], correct: 0, explain: "Nhóm đa lượng gồm C, H, O, N, P, K, S, Ca, Mg." },
        { text: "Câu 14. Vai trò chính của các nguyên tố đa lượng trong cơ thể thực vật là:", options: ["A. Tham gia cấu trúc nên các thành phần của tế bào.", "B. Hoạt hóa các enzyme trong quá trình trao đổi chất.", "C. Điều tiết tính thấm của màng tế bào.", "D. Quy định áp suất thẩm thấu của dịch tế bào."], correct: 0, explain: "Vai trò chính của đa lượng là tham gia cấu trúc tế bào." },
        { text: "Câu 15. Vai trò chính của các nguyên tố vi lượng trong cơ thể thực vật là:", options: ["A. Thành phần cấu phối của enzyme, hoạt hóa enzyme.", "B. Thành phần cấu tạo nên đại phân tử hữu cơ.", "C. Dự trữ năng lượng cho tế bào.", "D. Cung cấp năng lượng cho quá trình trao đổi chất."], correct: 0, explain: "Vi lượng chủ yếu đóng vai trò hoạt hóa enzyme." },
        { text: "Câu 16. Dạng nitrogen nào sau đây cây trồng có thể hấp thụ trực tiếp từ dung dịch đất?", options: ["A. NH4+ và NO3-.", "B. N2 và NO2-.", "C. N2 và NH4+.", "D. NO và NO2."], correct: 0, explain: "Cây hấp thụ trực tiếp NH4+ và NO3-." },
        { text: "Câu 17. Quá trình biến đổi NO3- thành NH4+ trong cơ thể thực vật được gọi là quá trình:", options: ["A. Khử nitrate.", "B. Đồng hóa ammonia.", "C. Cố định nitrogen.", "D. Nitrate hóa."], correct: 0, explain: "Quá trình biến đổi NO3- thành NH4+ là khử nitrate." },
        { text: "Câu 18. Vi sinh vật nào sau đây có khả năng cố định nitrogen khí quyển (N2)?", options: ["A. Vi khuẩn lam (Cyanobacteria) và vi khuẩn nốt sần (Rhizobium).", "B. Vi khuẩn nitrat hóa.", "C. Vi khuẩn phản nitrat hóa.", "D. Nấm mốc và amon hóa."], correct: 0, explain: "Vi khuẩn lam và vi khuẩn nốt sần cố định nitrogen." },
        { text: "Câu 19. Bón phân hợp lý cho cây trồng là:", options: ["A. Bón đúng loại, đúng liều lượng, đúng thời điểm và đúng cách.", "B. Bón càng nhiều phân bón càng tốt cho năng suất cây trồng.", "C. Bón phân tập trung vào thời kì cây bắt đầu ra hoa.", "D. Chỉ bón phân qua đường rễ mà không bón qua đường lá."], correct: 0, explain: "Bón phân hợp lý là đúng loại, đúng liều, đúng lúc, đúng cách." },
        { text: "Câu 20. Hậu quả của việc bón phân hóa học quá liều lượng là gì?", options: ["A. Gây độc cho cây, làm ô nhiễm môi trường đất và nước.", "B. Tăng năng suất cây trồng vượt mức tối đa.", "C. Tăng khả năng chống chịu bệnh tật của cây.", "D. Giúp cây phát triển nhanh hơn mà không gây hại."], correct: 0, explain: "Bón quá liều gây độc cho cây và ô nhiễm môi trường." },
        { text: "Câu 21. Quang hợp ở thực vật là quá trình biến đổi:", options: ["A. Quang năng thành hóa năng.", "B. Hóa năng thành quang năng.", "C. Nhiệt năng thành hóa năng.", "D. Quang năng thành nhiệt năng."], correct: 0, explain: "Quang hợp biến đổi quang năng thành hóa năng." },
        { text: "Câu 22. Sắc tố nào trực tiếp tham gia chuyển hóa năng lượng ánh sáng thành năng lượng trong ATP và NADPH?", options: ["A. Chlorophyll a ở trung tâm phản ứng.", "B. Chlorophyll b.", "C. Carotene.", "D. Xanthophyll."], correct: 0, explain: "Chlorophyll a ở trung tâm phản ứng trực tiếp chuyển hóa năng lượng." },
        { text: "Câu 23. Bào quan thực hiện chức năng quang hợp ở tế bào thực vật là:", options: ["A. Lục lạp.", "B. Ti thể.", "C. Không bào.", "D. Nhân tế bào."], correct: 0, explain: "Lục lạp thực hiện chức năng quang hợp." },
        { text: "Câu 24. Pha sáng của quá trình quang hợp diễn ra tại vị trí nào trong lục lạp?", options: ["A. Thylakoid.", "B. Chất nền (Stroma).", "C. Màng ngoài.", "D. Màng trong."], correct: 0, explain: "Pha sáng diễn ra ở thylakoid." },
        { text: "Câu 25. Pha tối (pha cố định CO2) của quá trình quang hợp diễn ra tại vị trí nào?", options: ["A. Chất nền (Stroma) của lục lạp.", "B. Màng thylakoid.", "C. Xoang thylakoid.", "D. Màng ngoài lục lạp."], correct: 0, explain: "Pha tối diễn ra ở chất nền (Stroma)." },
        { text: "Câu 26. Sản phẩm nào của pha sáng được sử dụng trong pha tối?", options: ["A. ATP và NADPH.", "B. O2 và ATP.", "C. CO2 và NADPH.", "D. H2O và ATP."], correct: 0, explain: "Sản phẩm pha sáng dùng cho pha tối là ATP và NADPH." },
        { text: "Câu 27. Chu trình Calvin là đường path cố định CO2 xảy ra ở nhóm thực vật nào?", options: ["A. Tất cả các nhóm thực vật (C3, C4, CAM).", "B. Chỉ có thực vật C3.", "C. Chỉ có thực vật C4.", "D. Chỉ có thực vật CAM."], correct: 0, explain: "Chu trình Calvin có ở tất cả các nhóm thực vật C3, C4, CAM." },
        { text: "Câu 28. Chất nhận CO2 đầu tiên trong chu trình Calvin ở thực vật C3 là:", options: ["A. RuBP (Ribulose-1,5-bisphosphate).", "B. PEP (Phosphoenolpyruvate).", "C. OAA (Oxaloacetate).", "D. PGA (3-phosphoglycerate)."], correct: 0, explain: "Chất nhận CO2 đầu tiên ở C3 là RuBP." },
        { text: "Câu 29. Sản phẩm cố định CO2 đầu tiên của thực vật C4 là chất nào?", options: ["A. OAA (Oxaloacetate) 4 carbon.", "B. PGA (3-phosphoglycerate) 3 carbon.", "C. RuBP (Ribulose-1,5-bisphosphate).", "D. Glucose."], correct: 0, explain: "Sản phẩm cố định CO2 đầu tiên của C4 là OAA." },
        { text: "Câu 30. Điểm khác biệt căn bản về thời gian cố định CO2 ở thực vật CAM so với thực vật C4 là:", options: ["A. Cố định CO2 ban đêm ở giai đoạn đầu.", "B. Cố định CO2 vào ban ngày.", "C. Không có chu trình Calvin.", "D. Diễn ra ở hai loại tế bào khác nhau."], correct: 0, explain: "Thực vật CAM cố định CO2 ban đêm ở giai đoạn đầu." },
        { text: "Câu 31. Hô hấp ở thực vật là quá trình:", options: ["A. Phân giải các chất hữu cơ giải phóng năng lượng ATP và nhiệt.", "B. Tổng hợp các chất hữu cơ tích lũy năng lượng.", "C. Hấp thụ CO2 và giải phóng O2.", "D. Chuyển hóa quang năng thành hóa năng."], correct: 0, explain: "Hô hấp phân giải chất hữu cơ giải phóng ATP và nhiệt." },
        { text: "Câu 32. Phương trình tổng quát của hô hấp hiếu khí là:", options: ["A. C6H12O6 + 6O2 -> 6CO2 + 6H2O + Q (ATP + Nhiệt).", "B. 6CO2 + 6H2O -> C6H12O6 + 6O2.", "C. C6H12O6 -> 2C2H5OH + 2CO2 + Q.", "D. C6H12O6 -> 2C3H6O3 + Q."], correct: 0, explain: "Phương trình hô hấp hiếu khí tạo ra CO2, H2O và năng lượng." },
        { text: "Câu 33. Bào quan đóng vai trò chính trong quá trình hô hấp hiếu khí là:", options: ["A. Ti thể.", "B. Lục lạp.", "C. Bộ máy Golgi.", "D. Ribosome."], correct: 0, explain: "Ti thể là bào quan chính trong hô hấp hiếu khí." },
        { text: "Câu 34. Các giai đoạn chính của hô hấp hiếu khí diễn ra theo thứ tự:", options: ["A. Đường phân -> Oxi hóa pyruvic acid và Chu trình Krebs -> Chuỗi truyền electron hô hấp.", "B. Chu trình Krebs -> Đường phân -> Chuỗi truyền electron.", "C. Đường phân -> Chuỗi truyền electron -> Chu trình Krebs.", "D. Chuỗi truyền electron -> Chu trình Krebs -> Đường phân."], correct: 0, explain: "Thứ tự là Đường phân -> Oxi hóa pyruvate & Krebs -> Chuỗi truyền electron." },
        { text: "Câu 35. Quá trình đường phân xảy ra ở đâu trong tế bào?", options: ["A. Tế bào chất (bào tương).", "B. Chất nền ti thể.", "C. Màng trong ti thể.", "D. Nhân tế bào."], correct: 0, explain: "Đường phân diễn ra ở tế bào chất." },
        { text: "Câu 36. Một phân tử glucose qua đường phân tạo ra hiệu quả năng lượng thuần là:", options: ["A. 2 ATP và 2 NADH.", "B. 32 ATP.", "C. 36 ATP.", "D. 4 ATP và 2 FADH2."], correct: 0, explain: "Đường phân thu thuần 2 ATP và 2 NADH." },
        { text: "Câu 37. Chu trình Krebs diễn ra ở vị trí nào trong ti thể?", options: ["A. Chất nền ti thể.", "B. Màng trong ti thể.", "C. Màng ngoài ti thể.", "D. Xoang gian màng."], correct: 0, explain: "Chu trình Krebs diễn ra ở chất nền ti thể." },
        { text: "Câu 38. Chuỗi truyền electron hô hấp diễn ra ở đâu?", options: ["A. Màng trong ti thể.", "B. Chất nền ti thể.", "C. Tế bào chất.", "D. Màng ngoài ti thể."], correct: 0, explain: "Chuỗi truyền electron hô hấp diễn ra ở màng trong ti thể." },
        { text: "Câu 39. Trong điều kiện thiếu oxygen, thực vật sẽ tiến hành quá trình nào?", options: ["A. Phân giải kị khí (Lên men).", "B. Hô hấp hiếu khí.", "C. Quang hô hấp.", "D. Tích lũy tinh bột."], correct: 0, explain: "Thiếu oxygen cây tiến hành phân giải kị khí." },
        { text: "Câu 40. Yếu tố môi trường nào sau đây ảnh hưởng trực tiếp và mạnh mẽ nhất đến hô hấp ở thực vật?", options: ["A. Hàm lượng nước, nhiệt độ, nồng độ O2 và CO2.", "B. Cường độ ánh sáng và độ pH đất.", "C. Độ ẩm không khí và gió.", "D. Áp suất khí quyển và sắc tố."], correct: 0, explain: "Nước, nhiệt độ, O2 và CO2 ảnh hưởng mạnh nhất đến hô hấp." },
        { text: "Câu 41. Nguyên tố nào sau đây là nguyên tố đa lượng?", options: ["A. Ca.", "B. Cl.", "C. Fe.", "D. Mo."], correct: 0, explain: "Calcium (Ca) là nguyên tố đa lượng." },
        { text: "Câu 42. Nguyên tố nào dưới đây là nguyên tố vi lượng?", options: ["A. Zn.", "B. Mg.", "C. K.", "D. S."], correct: 0, explain: "Zinc (Zn) là nguyên tố vi lượng." },
        { text: "Câu 43. Những nguyên tố nào dưới đây thuộc nguyên tố vi lượng?", options: ["A. C, H, O, K.", "B. Fe, Cu, Zn, Cl.", "C. P, Mg, S, N.", "D. P, K, N, Ca."], correct: 1, explain: "Fe, Cu, Zn, Cl thuộc nhóm vi lượng." },
        { text: "Câu 44. Cách nhận biết rõ rệt nhất thời điểm cây bị thiếu nguyên tố và cần bón phân là căn cứ vào", options: ["A. biểu hiện của quả non.", "B. biểu hiện của thân cây.", "C. biểu hiện của màu sắc hoa.", "D. biểu hiện của lá cây."], correct: 3, explain: "Nhận biết thiếu khoáng dựa vào biểu hiện của lá cây." },
        { text: "Câu 45. Khi lá bị vàng do thiếu chất diệp lục, cần bón cho cây nhóm nguyên tố nào sau đây?", options: ["A. N, P, S.", "B. N, K, S.", "C. N, K, Mg.", "D. N, Mg, Fe."], correct: 3, explain: "N, Mg, Fe giúp tổng hợp diệp lục khi lá vàng." },
        { text: "Câu 46. Ở thực vật, nguyên tố nào sau đây là thành phần của diệp lục, hoạt hóa enzyme liên quan đến sự vận chuyển gốc phosphate?", options: ["A. Calcium.", "B. Nitrogen.", "C. Magnesium.", "D. Potassium."], correct: 2, explain: "Magnesium (Mg) là thành phần diệp lục và hoạt hóa enzyme vận chuyển phosphate." },
        { text: "Câu 47. Ở thực vật, nguyên tố nào sau đây là thành phần của tế bào, hoạt hóa enzyme thủy phân ATP và phospholipid?", options: ["A. Calcium.", "B. Nitrogen.", "C. Magnesium.", "D. Potassium."], correct: 0, explain: "Calcium (Ca) tham gia thành tế bào và hoạt hóa enzyme thủy phân ATP." },
        { text: "Câu 48. Thiếu sắt (Fe) thì cây bị vàng cụ thể gân lá và lá cây hóa vàng, nguyên nhân do đâu?", options: ["A. Fe là thành phần cấu tạo diệp lục.", "B. Fe hoạt hóa enzyme xúc tác tổng hợp diệp lục.", "C. Fe là thành phần cấu tạo lục lạp.", "D. Fe hoạt hóa enzyme xúc tác cho quang hợp."], correct: 1, explain: "Sắt hoạt hóa enzyme xúc tác tổng hợp diệp lục." },
        { text: "Câu 49. 'Lá nhỏ, mềm, mầm đỉnh bị chết' dấu hiệu thường thấy khi cây thiếu hụt nguyên tố khoáng nào sau đây?", options: ["A. Cl", "B. P", "C. Mg", "D. Ca"], correct: 3, explain: "Thiếu Ca gây hiện tượng chết mầm đỉnh, lá nhỏ mềm." },
        { text: "Câu 50. Phát biểu nào sau đây là đúng về vai trò của Calcium (Ca) đối với thực vật?", options: ["A. Thành phần của thành tế bào, hoạt hóa enzyme thủy phân ATP và phospholipid.", "B. Thành phần của diệp lục, tham gia hoạt hóa enzyme liên quan đến sự vận chuyển gốc phosphate.", "C. Thành phần của nucleic acid, phospholipid, ATP và một số coenzyme.", "D. Thành phần của cytochrome, hoạt hóa enzyme của quá trình tổng hợp diệp lục."], correct: 0, explain: "Ca là thành phần thành tế bào, hoạt hóa enzyme thủy phân ATP." },
        { text: "Câu 51. Phát biểu nào sau đây là đúng về vai trò của Magnesium (Mg) đối với thực vật?", options: ["A. Thành phần của thành tế bào, hoạt hóa enzyme thủy phân ATP và phospholipid.", "B. Thành phần của diệp lục, tham gia hoạt hóa enzyme liên quan đến sự vận chuyển gốc phosphate.", "C. Thành phần của nucleic acid, phospholipid, ATP và một số coenzyme.", "D. Thành phần của cytochrome, hoạt hóa enzyme của quá trình tổng hợp diệp lục."], correct: 1, explain: "Mg là thành phần của diệp lục và hoạt hóa enzyme vận chuyển phosphate." },
        { text: "Câu 52. Phát biểu nào sau đây là đúng về vai trò của Phosphorus (P) đối với thực vật?", options: ["A. Thành phần của thành tế bào, hoạt hóa enzyme thủy phân ATP và phospholipid.", "B. Thành phần của diệp lục, tham gia hoạt hóa enzyme liên quan đến sự vận chuyển gốc phosphate.", "C. Thành phần của nucleic acid, phospholipid, ATP và một số coenzyme.", "D. Thành phần của cytochrome, hoạt hóa enzyme của quá trình tổng hợp diệp lục."], correct: 2, explain: "P là thành phần của nucleic acid, phospholipid, ATP và coenzyme." },
        { text: "Câu 53. Phát biểu nào sau đây đúng khi nói về vai trò của nguyên tố vi lượng?", options: ["A. Tham gia cấu trúc nên tế bào.", "B. Hoạt hóa enzyme trong trao đổi chất.", "C. Quy định áp suất thẩm thấu của dịch tế bào.", "D. Thúc đẩy quá trình chín của quả và hạt."], correct: 1, explain: "Vi lượng chủ yếu hoạt hóa enzyme trong trao đổi chất." },
        { text: "Câu 54. Nguyên tố đa lượng đóng vai trò chủ yếu là gì?", options: ["A. Tham gia cấu trúc nên tế bào.", "B. Hoạt hóa enzyme trong trao đổi chất.", "C. Quy định áp suất thẩm thấu của dịch tế bào.", "D. Thúc đẩy quá trình chín của quả và hạt."], correct: 0, explain: "Đa lượng tham gia cấu trúc nên tế bào." },
        { text: "Câu 55. Khi cây bị vàng úa, đưa vào gốc hoặc phun lên lá ion khoáng loại nào sau đây lá cây sẽ xanh trở lại?", options: ["A. Mg2+", "B. Ca2+", "C. Fe3+", "D. Na+"], correct: 0, explain: "Mg2+ giúp lá xanh trở lại do là thành phần của diệp lục." },
        { text: "Câu 56. Khi làm thí nghiệm trồng cây trong chậu đất nhưng thiếu một nguyên tố khoáng thì triệu chứng thiếu hụt khoáng thường xảy ra trước tiên ở những bộ phận non. Nguyên tố khoáng đó là?", options: ["A. Nitrogen.", "B. Calcium.", "C. Sắt.", "D. Phosphorus."], correct: 1, explain: "Calcium là nguyên tố khó di chuyển nên thiếu sẽ biểu hiện ở bộ phận non." },
        { text: "Câu 57. Phát biểu nào sau đây là sai khi nói về nguyên tố khoáng?", options: ["A. Trong thành phần cấu tạo của thực vật có hơn 50 nguyên tố, nhưng chỉ có khoảng 17 nguyên tố được xem là thiết yếu đối với cây.", "B. Khi thiếu nguyên tố khoáng thiết yếu, cây vẫn hoàn thành được chu kì sống của mình.", "C. Có hai loại nguyên tố khoáng là nguyên tố đa lượng và nguyên tố vi lượng.", "D. Nguyên tố khoáng có 2 vai trò chính là cấu trúc nên các thành phần của tế bào và điều tiết quá trình sinh lý."], correct: 1, explain: "Thiếu nguyên tố thiết yếu thì cây không thể hoàn thành chu kì sống." },
        { text: "Câu 58. Quang hợp ở thực vật là:", options: ["A. Quá trình lục lạp hấp thụ và sử dụng năng lượng hóa học để tổng hợp các chất hữu cơ từ các chất vô cơ.", "B. Quá trình ti thể hấp thụ và sử dụng năng lượng ánh sáng để tổng hợp các chất hữu cơ từ các chất vô cơ.", "C. Quá trình lục lạp hấp thụ và sử dụng năng lượng ánh sáng để tổng hợp các chất hữu cơ từ các chất vô cơ.", "D. Quá trình lục lạp hấp thụ và sử dụng năng lượng ánh sáng để phân giải chất hữu cơ sinh năng lượng."], correct: 2, explain: "Quang hợp là quá trình lục lạp hấp thụ năng lượng ánh sáng tổng hợp chất hữu cơ." },
        { text: "Câu 59. Nguyên liệu của quá trình quang hợp:", options: ["A. CO2, H2O", "B. CO2, O2", "C. O2, H2O", "D. CO2, H2O, O2"], correct: 0, explain: "Nguyên liệu quang hợp là CO2 và H2O." },
        { text: "Câu 60. Khí nào được thải ra trong quá trình quang hợp?", options: ["A. Oxygen.", "B. Carbon dioxide.", "C. Ánh sáng.", "D. Chlorophyll."], correct: 0, explain: "Khí thải ra trong quang hợp là oxygen." },
        { text: "Câu 61. Sản phẩm chính của quang hợp là gì?", options: ["A. C6H12O6, H2O.", "B. C6H12O6, CO2.", "C. C6H12O6, O2.", "D. C6H12O6, ATP."], correct: 2, explain: "Sản phẩm chính của quang hợp là glucose và oxygen." },
        { text: "Câu 62. Năng lượng tích lũy trong các chất hữu cơ sau quang hợp có nguồn gốc từ đâu?", options: ["A. CO2", "B. H2O", "C. Diệp lục", "D. Ánh sáng"], correct: 3, explain: "Năng lượng tích lũy có nguồn gốc từ ánh sáng mặt trời." },
        { text: "Câu 63. Quang hợp thực chất là quá trình:", options: ["A. Đồng hóa, giải phóng năng lượng.", "B. Đồng hóa, tích lũy năng lượng.", "C. Dị hóa, tích lũy năng lượng.", "D. Dị hóa, giải phóng năng lượng."], correct: 1, explain: "Quang hợp là quá trình đồng hóa và tích lũy năng lượng." },
        { text: "Câu 64. Bản chất của quá trình quang hợp là quá trình:", options: ["A. Tiêu hóa và phân giải hóa năng.", "B. Hấp thụ và chuyển hóa hóa năng.", "C. Hấp thụ và chuyển hóa quang năng thành hóa năng.", "D. Tiêu hóa và phân giải hóa năng thành nhiệt năng."], correct: 2, explain: "Bản chất là chuyển hóa quang năng thành hóa năng." },
        { text: "Câu 65. Đâu là cơ quan quang hợp chủ yếu ở thực vật trên cạn?", options: ["A. Lá", "B. Thân", "C. Rễ", "D. Hoa"], correct: 0, explain: "Lá là cơ quan quang hợp chủ yếu." },
        { text: "Câu 66. Bào quan quang hợp chủ yếu ở thực vật là gì?", options: ["A. Ti thể.", "B. Peroxisome.", "C. Lục lạp.", "D. Ribosome."], correct: 2, explain: "Lục lạp là bào quan quang hợp chủ yếu." },
        { text: "Câu 67. Hệ sắc tố quang hợp phân bố chủ yếu ở đâu?", options: ["A. Xoang thylakoid", "B. Màng thylakoid", "C. Chất nền lục lạp.", "D. Màng trong lục lạp"], correct: 1, explain: "Hệ sắc tố phân bố ở màng thylakoid." },
        { text: "Câu 68. Vai trò của hệ sắc tố quang hợp?", options: ["A. Hấp thụ và chuyển hóa năng lượng ánh sáng.", "B. Hấp thụ và phân giải năng lượng ánh sáng.", "C. Hấp thụ và tổng hợp năng lượng ATP.", "D. Phân giải năng lượng ánh sáng để tạo ATP."], correct: 0, explain: "Hệ sắc tố hấp thụ và chuyển hóa năng lượng ánh sáng." },
        { text: "Câu 69. Sắc tố quang hợp chính ở thực vật là:", options: ["A. Xanthophyll", "B. Diệp lục (Chlorophyll)", "C. Phicobilin.", "D. Carotenoid"], correct: 1, explain: "Diệp lục là sắc tố quang hợp chính." },
        { text: "Câu 70. Chất nào sau đây không phải sắc tố quang hợp?", options: ["A. Phicobilin", "B. Carotenoid", "C. Diệp lục", "D. Gibberellin."], correct: 3, explain: "Gibberellin là hormone thực vật, không phải sắc tố quang hợp." },
        { text: "Câu 71. Sắc tố quang hợp nào làm nhiệm vụ trực tiếp biến quang năng thành hóa năng trong ATP và NADPH?", options: ["A. Chlorophyll b", "B. Chlorophyll a", "C. Carotenoid.", "D. Xanthophyll"], correct: 1, explain: "Chlorophyll a trực tiếp biến đổi quang năng." },
        { text: "Câu 72. Ở các loại rau củ, lá có màu đỏ và cam chứa nhiều sắc tố nào sau đây?", options: ["A. Carotenoid", "B. Cytokinin", "C. Diệp lục (chlorophyll)", "D. Phicobilin."], correct: 0, explain: "Carotenoid tạo màu đỏ, cam, vàng." },
        { text: "Câu 73. Sắc tố tạo nên màu xanh của lá là:", options: ["A. Carotenoid", "B. Cytokinin", "C. Diệp lục (chlorophyll)", "D. Phicobilin."], correct: 2, explain: "Diệp lục tạo nên màu xanh của lá." },
        { text: "Câu 74. Các sắc tố quang hợp hấp thụ năng lượng ánh sáng và truyền cho nhau theo sơ đồ nào sau đây?", options: ["A. Carotenoid -> Diệp lục b -> Diệp lục a -> Diệp lục a trung tâm phản ứng.", "B. Carotenoid -> Diệp lục a -> Diệp lục b -> Diệp lục b trung tâm phản ứng.", "C. Diệp lục b -> Carotenoid -> Diệp lục a -> Diệp lục a trung tâm phản ứng.", "D. Diệp lục a -> Diệp lục b -> Carotenoid -> Carotenoid trung tâm phản ứng"], correct: 0, explain: "Truyền năng lượng từ carotenoid sang diệp lục b, diệp lục a rồi tới trung tâm phản ứng." },
        { text: "Câu 75. Trong phương trình tổng quát của quang hợp phần tử CO2 cây lấy từ đâu?", options: ["A. Đất qua tế bào lông hút của rễ.", "B. Không khí qua khí khổng của lá.", "C. Nước qua tế bào lông hút của rễ.", "D. Chất hữu cơ bởi quá trình tổng hợp của cây"], correct: 1, explain: "Cây lấy CO2 từ không khí qua khí khổng của lá." },
        { text: "Câu 76. Trong quá trình quang hợp, cây lấy nước chủ yếu từ quá trình nào sau đây?", options: ["A. Sự thoát hơi nước theo lỗ khí được hấp thụ lại.", "B. Sự hấp thụ của rễ cây hút từ đất đưa lên lá.", "C. Việc tưới nước lên lá thẩm thấu qua tế bào vào lá.", "D. Hơi nước trong không khí được tái hấp thụ"], correct: 1, explain: "Rễ cây hút nước từ đất đưa lên lá phục vụ quang hợp." },
        { text: "Câu 77. Hô hấp ở thực vật là quá trình:", options: ["A. Tổng hợp các hợp chất hữu cơ từ CO2 và H2O, đồng thời giải phóng năng lượng ATP và nhiệt.", "B. Tổng hợp các hợp chất hữu cơ từ CO2 và H2O, đồng thời tích lũy năng lượng ATP và nhiệt", "C. Phân giải các hợp chất hữu cơ thành CO2 và H2O, đồng thời phân giải năng lượng ATP và nhiệt", "D. Phân giải các hợp chất hữu cơ thành CO2 và H2O, đồng thời tạo năng lượng ATP và nhiệt"], correct: 3, explain: "Hô hấp là phân giải chất hữu cơ tạo ATP và nhiệt." },
        { text: "Câu 78. Phương trình tổng quát của quá trình hô hấp ở thực vật là gì?", options: ["A. C6H12O6 + 6O2 -> 6CO2 + 6H2O.", "B. 6CO2 + 6H2O -> C6H12O6 + 6O2.", "C. 6CO2 + 6H2O + Q (ATP + nhiệt) -> C6H12O6 + 6O2.", "D. C6H12O6 + 6O2 -> 6CO2 + 6H2O + Q (ATP + nhiệt)."], correct: 3, explain: "Phương trình hô hấp hiếu khí tạo CO2, H2O và năng lượng ATP, nhiệt." },
        { text: "Câu 79. Hô hấp thực chất là quá trình:", options: ["A. Đồng hóa, giải phóng năng lượng.", "B. Đồng hóa, tích lũy năng lượng.", "C. Dị hóa, tích lũy năng lượng.", "D. Dị hóa, giải phóng năng lượng."], correct: 3, explain: "Hô hấp là quá trình dị hóa và giải phóng năng lượng." },
        { text: "Câu 80. Nguyên liệu của quá trình hô hấp ở thực vật là gì?", options: ["A. C6H12O6, O2", "B. CO2, H2O", "C. C6H12O6, CO2", "D. CO2, H2O, O2"], correct: 0, explain: "Nguyên liệu hô hấp là đường glucose và oxygen." },

        { text: "Câu 82. Sản phẩm chính của hô hấp ở thực vật?", options: ["A. CO2, H2O, ATP.", "B. C6H12O6, CO2, ATP.", "C. C6H12O6, O2, ATP", "D. C6H12O6, ATP"], correct: 0, explain: "Sản phẩm chính là CO2, H2O và ATP." },
        { text: "Câu 83. Ở thực vật, quá trình hô hấp tạo ra dạng năng lượng nào cung cấp trực tiếp cho các hoạt động sống?", options: ["A. ATP.", "B. Nhiệt năng.", "C. NADH.", "D. FADH2."], correct: 0, explain: "ATP cung cấp năng lượng trực tiếp cho hoạt động sống." },
        { text: "Câu 84. Trong quá trình hô hấp, một phần năng lượng bị mất đi dưới dạng nào?", options: ["A. Hóa năng.", "B. Nhiệt năng.", "C. Điện năng.", "D. Cơ năng."], correct: 1, explain: "Năng lượng bị thất thoát chủ yếu dưới dạng nhiệt năng." },
        { text: "Câu 85. Bản chất của hô hấp tế bào là quá trình chuyển hóa:", options: ["A. Quang năng -> hóa năng + nhiệt năng", "B. Hóa năng -> hóa năng (ATP) + nhiệt năng", "C. Hóa năng -> cơ năng + nhiệt năng", "D. Hóa năng -> điện năng + nhiệt năng"], correct: 1, explain: "Bản chất là chuyển hóa hóa năng thành hóa năng trong ATP và nhiệt năng." },
        { text: "Câu 86. Trong hô hấp ở thực vật, năng lượng được giải phóng có nguồn gốc từ đâu?", options: ["A. Ánh sáng mặt trời.", "B. Việc bẻ gãy các liên kết hóa học.", "C. Việc hình thành các liên kết hóa học.", "D. Các hoạt động sống của cơ thể."], correct: 1, explain: "Năng lượng giải phóng từ việc bẻ gãy các liên kết hóa học trong chất hữu cơ." },
        { text: "Câu 87. Ở thực vật, bộ phận nào làm nhiệm vụ hô hấp?", options: ["A. Tất cả bộ phận.", "B. Rễ.", "C. Thân.", "D. Lá."], correct: 0, explain: "Tất cả các bộ phận của thực vật đều hô hấp." },
        { text: "Câu 88. Trong cây, bộ phận nào diễn ra hô hấp mạnh nhất ở thực vật?", options: ["A. Rễ.", "B. Thân.", "C. Lá.", "D. Hoa."], correct: 0, explain: "Rễ là cơ quan hô hấp mạnh nhất (đặc biệt là vùng lông hút)." },
        { text: "Câu 89. Ở thực vật, bào quan thực hiện hô hấp là gì?", options: ["A. Ti thể.", "B. Lục lạp.", "C. Không bào.", "D. Bộ máy Golgi."], correct: 0, explain: "Ti thể là bào quan thực hiện hô hấp tế bào." },
        { text: "Câu 90. Quá trình hô hấp ở thực vật có vai trò gì?", options: ["A. Tạo năng lượng cung cấp cho các hoạt động sống của tế bào và cơ thể.", "B. Đảm bảo cân bằng O2 và CO2 trong khí quyển.", "C. Làm sạch không khí.", "D. Chuyển hóa carbohydrate thành CO2 và H2O."], correct: 0, explain: "Vai trò chính là tạo năng lượng cung cấp cho các hoạt động sống." },
        { text: "Câu 91. Vai trò quan trọng nhất của hô hấp ở thực vật là", options: ["A. Tổng hợp các chất và tích lũy năng lượng cho tế bào.", "B. Cung cấp năng lượng ATP phục vụ các hoạt động sống của tế bào.", "C. Tạo các sản phẩm trung gian cho các quá trình tổng hợp các chất.", "D. Góp phần duy trì ổn định nhiệt độ tế bào và cơ thể."], correct: 1, explain: "Cung cấp năng lượng ATP phục vụ hoạt động sống là vai trò quan trọng nhất." },
        { text: "Câu 92. Các giai đoạn chính của hô hấp hiếu khí diễn ra theo trật tự nào?", options: ["A. Chu trình Krebs -> Đường phân -> Chuỗi truyền electron.", "B. Đường phân -> Chuỗi truyền electron -> Chu trình Krebs.", "C. Đường phân -> Chu trình Krebs -> Chuỗi truyền electron hô hấp.", "D. Chuỗi truyền electron -> Chu trình Krebs -> Đường phân."], correct: 2, explain: "Thứ tự: Đường phân -> Chu trình Krebs -> Chuỗi truyền electron hô hấp." },
        { text: "Câu 93. Các giai đoạn của quá trình phân giải kị khí diễn ra theo trật tự nào?", options: ["A. Đường phân -> Lên men.", "B. Đường phân -> Chu trình Krebs -> Chuỗi truyền electron.", "C. Đường phân -> Lên men -> Chuỗi truyền electron.", "D. Lên men -> Đường phân."], correct: 0, explain: "Phân giải kị khí gồm đường phân và lên men." },
        { text: "Câu 94. Kết thúc hô hấp hiếu khí, phân giải hoàn toàn 1 phân tử glucose thu được bao nhiêu ATP?", options: ["A. 30 - 32 ATP.", "B. 26 - 28 ATP.", "C. 2 ATP.", "D. 4 ATP."], correct: 0, explain: "Thu được khoảng 30 - 32 ATP từ phân giải hoàn toàn 1 glucose." },
        { text: "Câu 95. Trong hô hấp ở thực vật, quá trình đường phân xảy ra ở đâu?", options: ["A. Chất nền của ti thể.", "B. Tế bào chất (bào tương).", "C. Màng trong của ti thể.", "D. Màng ngoài của ti thể."], correct: 1, explain: "Đường phân xảy ra ở tế bào chất (bào tương)." },
        { text: "Câu 96. Trong quá trình hô hấp, giai đoạn đường phân có đặc điểm gì?", options: ["A. Kị khí và xảy ra trong ti thể.", "B. Hiếu khí và xảy ra trong ti thể.", "C. Kị khí và xảy ra trong tế bào chất.", "D. Hiếu khí và xảy ra trong tế bào chất."], correct: 2, explain: "Đường phân là quá trình kị khí xảy ra trong tế bào chất." },
        { text: "Câu 97. Năng lượng tế bào thu được (tích lũy) khi đường phân 1 phân tử glucose là bao nhiêu ATP?", options: ["A. 4 ATP", "B. 1 ATP", "C. 2 ATP", "D. 34 ATP"], correct: 2, explain: "Đường phân thu thuần 2 ATP." },
        { text: "Câu 98. Nguyên liệu chủ yếu của quá trình đường phân là gì?", options: ["A. Sucrose.", "B. Glycogen.", "C. Glucose.", "D. Cellulose."], correct: 2, explain: "Nguyên liệu chủ yếu của đường phân là glucose." },
        { text: "Câu 99. Sơ đồ tóm tắt nào sau đây thể hiện đúng quá trình đường phân?", options: ["A. 1 glucose -> 2 pyruvic acid + 2 ATP + 2 NADH.", "B. 1 glucose -> 2 pyruvic acid + CO2 + ATP.", "C. 1 glucose -> 2 pyruvic acid + nước + ATP.", "D. 1 glucose -> 2 CO2 + nước + 2 ATP."], correct: 0, explain: "1 phân tử glucose tạo 2 pyruvic acid, 2 ATP và 2 NADH." },
        { text: "Câu 100. Sản phẩm nào của quá trình đường phân được vận chuyển vào chất nền ti thể để tiếp tục phân giải?", options: ["A. Acetyl CoA.", "B. Pyruvic acid.", "C. Lactic acid.", "D. Citric acid."], correct: 1, explain: "Pyruvic acid được vận chuyển vào chất nền ti thể." },
        { text: "Câu 101. Giai đoạn chung của quá trình lên men và hô hấp hiếu khí là:", options: ["A. Chuỗi truyền electron.", "B. Chu trình Krebs.", "C. Đường phân.", "D. Tổng hợp Acetyl - CoA."], correct: 2, explain: "Đường phân là giai đoạn chung cho cả hô hấp hiếu khí và lên men." },
        { text: "Câu 102. Sau giai đoạn đường phân, pyruvic acid bị oxy hóa thành hợp chất nào sau đây?", options: ["A. Oxaloacetat.", "B. Acetyl-CoA.", "C. Succinate.", "D. Succinyl-CoA."], correct: 1, explain: "Pyruvic acid bị oxy hóa thành Acetyl-CoA." },
        { text: "Câu 103. Sau giai đoạn đường phân, quá trình oxy hóa pyruvic acid diễn ra ở đâu?", options: ["A. Màng ngoài của ti thể.", "B. Chất nền của ti thể.", "C. Ribosome ti thể.", "D. Màng trong của ti thể."], correct: 1, explain: "Oxy hóa pyruvic acid diễn ra ở chất nền của ti thể." },
        { text: "Câu 104. Sơ đồ oxy hóa pyruvic acid nào sau đây đúng?", options: ["A. 2 Acetyl - CoA + 2 CO2 + 2 NADH -> 2 Pyruvic acid", "B. 2 Pyruvic acid -> 2 Acetyl-CoA + 2 CO2 + 2 NADH.", "C. 2 Pyruvic acid -> 2 Acetyl-CoA + 2 CO2 + 2 ATP.", "D. 2 Pyruvic acid -> 2 Acetyl-CoA + 2 CO2 + 2 FADH2."], correct: 1, explain: "2 Pyruvic acid chuyển hóa thành 2 Acetyl-CoA giải phóng CO2 và tạo 2 NADH." },
        { text: "Câu 105. Nguyên liệu đi vào chu trình Krebs là:", options: ["A. Glucose.", "B. Pyruvic acid.", "C. Acetyl-CoA.", "D. NADH, FADH2."], correct: 2, explain: "Nguyên liệu đi vào chu trình Krebs là Acetyl-CoA." },
        { text: "Câu 106. Nơi diễn ra chu trình Krebs là:", options: ["A. Màng ngoài của ti thể.", "B. Chất nền của ti thể.", "C. Ribosome ti thể.", "D. Màng trong của ti thể."], correct: 1, explain: "Chu trình Krebs diễn ra ở chất nền ti thể." },
        { text: "Câu 107. Sơ đồ nào sau đây phản ánh đúng chu trình Krebs?", options: ["A. 2 Acetyl-CoA -> 6 CO2 + 2 ATP + 10 NADH + 2 FADH2", "B. 2 Acetyl-CoA -> 4 CO2 + 2 ATP + 6 NADH + 2 FADH2.", "C. 2 Pyruvic acid -> 6 CO2 + 2 ATP + 10 NADH + 2 FADH2", "D. 2 Pyruvic acid -> 4 CO2 + 2 ATP + 4 NADH + 2 FADH2"], correct: 1, explain: "2 phân tử Acetyl-CoA qua chu trình Krebs tạo ra 4 CO2, 2 ATP, 6 NADH và 2 FADH2." },
        { text: "Câu 108. Trong chu trình Krebs, mỗi phân tử acetyl – CoA được oxy hóa hoàn toàn tạo ra sản phẩm là gì?", options: ["A. 2 ATP, 4 CO2.", "B. 1 ATP, 1 CO2.", "C. 1 ATP, 2 CO2.", "D. 1 ATP, 4 CO2."], correct: 2, explain: "Mỗi acetyl-CoA tạo ra 1 ATP và 2 CO2 sau khi oxy hóa hoàn toàn." }

    function loadExam() {
        document.getElementById("score-display").innerText = "Điểm: Chưa nộp bài";

        // Render Phần 1 (108 câu)
        let p1HTML = "";
        POOL_PART1.forEach((q, idx) => {
            p1HTML += `<div class="question-card">
                <div class="question-text">${q.text}</div>
                <div class="options">`;
            q.options.forEach((opt, oIdx) => {
                p1HTML += `<label><input type="radio" name="p1_${idx}" value="${oIdx}">${opt}</label>`;
            });
            p1HTML += `</div><div class="feedback" id="fb_p1_${idx}"></div></div>`;
        });
        document.getElementById("part1-container").innerHTML = p1HTML;

        // Render Phần 2 (10 câu)
        let p2HTML = "";
        POOL_PART2.forEach((q, idx) => {
            p2HTML += `<div class="question-card">
                <div class="question-text">${q.title}</div>`;
            q.sub.forEach((s, sIdx) => {
                p2HTML += `<div class="sub-question">
                    <div class="sub-text">${s.text}</div>
                    <div class="sub-options">
                        <label><input type="radio" name="p2_${idx}_${sIdx}" value="true"> Đúng</label>
                        <label><input type="radio" name="p2_${idx}_${sIdx}" value="false"> Sai</label>
                    </div>
                </div>
                <div class="feedback" id="fb_p2_${idx}_${sIdx}"></div>`;
            });
            p2HTML += `</div>`;
        });
        document.getElementById("part2-container").innerHTML = p2HTML;
        window.scrollTo(0, 0);
    }

    function gradeExam() {
        let p1Score = 0;
        let p2Score = 0;
        const p1Max = 7.0;
        const p2Max = 3.0;

        const p1PerQ = p1Max / POOL_PART1.length;
        
        let totalSubs = 0;
        POOL_PART2.forEach(q => totalSubs += q.sub.length);
        const p2PerSub = p2Max / totalSubs;

        // Chấm Phần 1
        POOL_PART1.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="p1_${idx}"]:checked`);
            const fb = document.getElementById(`fb_p1_${idx}`);
            if (selected && parseInt(selected.value) === q.correct) {
                p1Score += p1PerQ;
                fb.className = "feedback correct";
                fb.innerHTML = `✓ Chính xác! 💡 Giải thích: ${q.explain}`;
            } else {
                fb.className = "feedback incorrect";
                fb.innerHTML = `✗ Chưa đúng! Đáp án chuẩn: ${q.options[q.correct]}<br>💡 Giải thích: ${q.explain}`;
            }
        });

        // Chấm Phần 2
        POOL_PART2.forEach((q, idx) => {
            q.sub.forEach((s, sIdx) => {
                const selected = document.querySelector(`input[name="p2_${idx}_${sIdx}"]:checked`);
                const fb = document.getElementById(`fb_p2_${idx}_${sIdx}`);
                if (selected) {
                    const userVal = selected.value === "true";
                    if (userVal === s.correct) {
                        p2Score += p2PerSub;
                        fb.className = "feedback correct";
                        fb.innerHTML = `✓ Đúng! 💡 ${s.explain}`;
                    } else {
                        fb.className = "feedback incorrect";
                        const correctStr = s.correct ? "ĐÚNG" : "SAI";
                        fb.innerHTML = `✗ Sai! Đáp án chuẩn: ${correctStr}. 💡 ${s.explain}`;
                    }
                } else {
                    fb.className = "feedback incorrect";
                    const correctStr = s.correct ? "ĐÚNG" : "SAI";
                    fb.innerHTML = `⚠️ Chưa chọn! Đáp án chuẩn: ${correctStr}. 💡 ${s.explain}`;
                }
            });
        });

        const totalScore = (p1Score + p2Score).toFixed(2);
        document.getElementById("score-display").innerText = `TỔNG ĐIỂM: ${totalScore} / 10.0đ (P1: ${p1Score.toFixed(2)}đ | P2: ${p2Score.toFixed(2)}đ)`;
        alert(`Bạn đã hoàn thành bài thi!\nTổng điểm của bạn là: ${totalScore} / 10.0 Điểm`);
        window.scrollTo(0, 0);
    }

    window.onload = loadExam;
</script>
